[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smanager"
dynamic = ["version"]
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    "click>=8.0",
    "rich>=13.0",
    "InquirerPy>=0.3.4",
]

[tool.setuptools.dynamic]
version = {attr = "smanager.__version__"}

[project.scripts]
smanager = "smanager.cli.main:cli"
