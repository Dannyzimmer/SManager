[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "smanager"
dynamic = ["version"]
requires-python = ">=3.9"

[tool.setuptools.dynamic]
version = {attr = "smanager.__version__"}
dependencies = [
    "PyYAML>=6.0",
    "click>=8.0",
]

[project.scripts]
smanager = "smanager.cli.main:cli"
